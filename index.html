<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Adwful</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#080808;color:#fff;font-family:Inter,system-ui,Arial,sans-serif}
    body{overflow-x:hidden}
    .wall{
      width:100%;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:6px;
      padding:6px;
      align-items:stretch;
    }
    .slot{
      min-width:0;
      min-height:150px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      background:#0d0d0d;
      border:1px solid #191919;
    }
    .slot iframe{
      display:block;
      width:100%;
      height:100%;
      min-height:150px;
      border:0;
      background:transparent;
    }
    @media (min-width:700px){
      .wall{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
      .slot{min-height:180px}
      .slot iframe{min-height:180px}
    }
    @media (min-width:1200px){
      .wall{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
    }
    @media (max-width:420px){
      .wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px}
      .slot{min-height:125px}
      .slot iframe{min-height:125px}
    }
  </style>
</head>
<body>
  <main id="wall" class="wall" aria-label="Advertisement wall"></main>

  <script>
    const bannerUnits = [
      {key:'797c350931164b2af01d762860993be3',w:728,h:90},
      {key:'008faa77f149997884b507f444cfb4cd',w:320,h:50},
      {key:'d770303609f4c4028b2b1446cf810ac1',w:160,h:600},
      {key:'74623eb82832c7260317b236874c435f',w:160,h:300},
      {key:'aea01d34a2c5e0b8c07ee9c98a71a19a',w:468,h:60}
    ];

    const nativeUnit = {
      src:'https://biomanos.org/21/55bd8aeabd90917c2c56507883ab80df',
      id:'container-55bd8aeabd90917c2c56507883ab80df'
    };

    function esc(s){
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
    }

    function bannerDoc(unit){
      const scaleCss = `
        <style>
          html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
          body{display:flex;align-items:center;justify-content:center}
          #wrap{transform-origin:center center}
          @media(max-width:${unit.w}px){#wrap{transform:scale(calc((100vw - 4px)/${unit.w}));}}
        </style>`;
      const code = `
        <div id="wrap">
          <script>
            atOptions={
              'key':'${unit.key}',
              'format':'iframe',
              'height':${unit.h},
              'width':${unit.w},
              'params':{}
            };
          <\/script>
          <script src="https://biomanos.org/22/${unit.key}"><\/script>
        </div>`;
      return scaleCss + code;
    }

    function nativeDoc(){
      return `
        <style>
          html,body{margin:0;width:100%;height:100%;background:transparent;overflow:auto}
          #${nativeUnit.id}{width:100%;min-height:100%}
        </style>
        <script async data-cfasync="false" src="${nativeUnit.src}"><\/script>
        <div id="${nativeUnit.id}"></div>`;
    }

    const wall = document.getElementById('wall');
    const totalSlots = 106;

    for(let i=0;i<totalSlots;i++){
      const section = document.createElement('section');
      section.className = 'slot';

      const frame = document.createElement('iframe');
      frame.loading = i < 12 ? 'eager' : 'lazy';
      frame.referrerPolicy = 'strict-origin-when-cross-origin';
      frame.setAttribute('sandbox','allow-scripts allow-popups allow-popups-to-escape-sandbox allow-forms');

      if(i % 6 === 0){
        frame.srcdoc = nativeDoc();
      } else {
        frame.srcdoc = bannerDoc(bannerUnits[(i-1) % bannerUnits.length]);
      }

      section.appendChild(frame);
      wall.appendChild(section);
    }
  </script>

  <script data-cfasync="false" src="https://benchform.org/1/bfe86e73a31386d4d08fe52554d3ddb4"></script>
  <script data-cfasync="false" src="https://biomanos.org/14/11e239d255d66bf838f48f2fa61014d5"></script>
</body>
</html>
