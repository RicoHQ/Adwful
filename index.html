<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adwful</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff}
body{overflow-x:hidden;font-family:system-ui,Arial,sans-serif}
.wall{
  --gap:1px;
  --row:4px;
  --mincol:18px;
  width:100%;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(var(--mincol),1fr));
  grid-auto-rows:var(--row);
  grid-auto-flow:dense;
  gap:var(--gap);
  padding:var(--gap);
}
.slot{
  min-width:0;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#fff;
  contain:layout paint style;
}
.mount{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.scaled{
  transform:scale(.1);
  transform-origin:center center;
  flex:0 0 auto;
}
.slot iframe{display:block!important;border:0!important}
@media(max-width:700px){.wall{--gap:0px;--row:3px;--mincol:12px}}
@media(max-width:420px){.wall{--row:2px;--mincol:9px}}
</style>

<script>
(() => {
  const wall = document.getElementById('wall');
  const slots = [...document.querySelectorAll('.slot')];
  const state = new Map();
  let activeLoads = 0;
  const MAX_CONCURRENT = 3;
  const MAX_LIVE = 24;
  const pending = [];

  function metrics(){
    const cs = getComputedStyle(wall);
    const gap = parseFloat(cs.gap) || 0;
    const row = parseFloat(cs.gridAutoRows) || 2;
    const cols = Math.max(1, cs.gridTemplateColumns.split(' ').length);
    const inner = wall.clientWidth - gap * Math.max(0, cols - 1);
    return {gap,row,cols,col:inner / cols};
  }

  function pack(slot){
    const m = metrics();
    const w = parseFloat(slot.dataset.w) || m.col;
    const h = parseFloat(slot.dataset.h) || m.row;
    const colSpan = Math.max(1, Math.min(m.cols, Math.ceil((w + m.gap) / (m.col + m.gap))));
    const rowSpan = Math.max(1, Math.ceil((h + m.gap) / (m.row + m.gap)));
    slot.style.gridColumnEnd = 'span ' + colSpan;
    slot.style.gridRowEnd = 'span ' + rowSpan;
  }

  function liveCount(){
    let n = 0;
    for (const s of state.values()) if (s.live) n++;
    return n;
  }

  function distanceToViewport(slot){
    const r = slot.getBoundingClientRect();
    if (r.bottom < 0) return -r.bottom;
    if (r.top > innerHeight) return r.top - innerHeight;
    return 0;
  }

  function evictFar(){
    const live = slots.filter(s => state.get(s)?.live);
    live.sort((a,b) => distanceToViewport(b) - distanceToViewport(a));
    while (live.length > MAX_LIVE) {
      const slot = live.shift();
      const st = state.get(slot);
      if (!st || st.loading) continue;
      slot.querySelector('.mount').replaceChildren();
      state.set(slot,{live:false,loading:false});
    }
  }

  function mount(slot){
    const st = state.get(slot) || {live:false,loading:false};
    if (st.live || st.loading) return;
    if (activeLoads >= MAX_CONCURRENT) {
      if (!pending.includes(slot)) pending.push(slot);
      return;
    }

    activeLoads++;
    state.set(slot,{live:false,loading:true});

    const mount = slot.querySelector('.mount');
    mount.replaceChildren();

    const ow = Number(slot.dataset.ow);
    const oh = Number(slot.dataset.oh);
    const key = slot.dataset.key;

    const wrap = document.createElement('div');
    wrap.className = 'scaled';
    wrap.style.width = ow + 'px';
    wrap.style.height = oh + 'px';

    const cfg = document.createElement('script');
    cfg.text = "atOptions={key:'" + key + "',format:'iframe',height:" + oh + ",width:" + ow + ",params:{}};";

    const src = document.createElement('script');
    src.src = 'https://biomanos.org/22/' + key;
    src.async = true;

    const finish = () => {
      activeLoads = Math.max(0, activeLoads - 1);
      state.set(slot,{live:true,loading:false});
      evictFar();
      const next = pending.shift();
      if (next) mount(next);
    };

    src.onload = finish;
    src.onerror = finish;
    wrap.append(cfg, src);
    mount.appendChild(wrap);
    setTimeout(() => {
      const cur = state.get(slot);
      if (cur?.loading) finish();
    }, 5000);
  }

  slots.forEach(slot => {
    pack(slot);
    state.set(slot,{live:false,loading:false});
  });

  const io = new IntersectionObserver(entries => {
    entries
      .filter(e => e.isIntersecting)
      .sort((a,b) => distanceToViewport(a.target) - distanceToViewport(b.target))
      .forEach(e => mount(e.target));
    evictFar();
  }, {rootMargin:'250px 0px 250px 0px', threshold:0.01});

  slots.forEach(slot => io.observe(slot));

  window.addEventListener('resize', () => {
    slots.forEach(pack);
    evictFar();
  }, {passive:true});
})();
</script>
