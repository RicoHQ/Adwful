<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adwful</title>
<style>
  html,body{margin:0;min-height:100%;background:#fff}
  body{overflow-x:hidden}
  #wall{position:relative;width:100%;margin:0 auto}
  .ad-tile{position:absolute;overflow:hidden;background:#fff}
  .ad-tile iframe{display:block;border:0;transform-origin:top left}
  #sentinel{height:1px}
  #container-55bd8aeabd90917c2c56507883ab80df{max-width:100%;margin:0 auto}
  .slot-page #wall,.slot-page #sentinel{display:none}
  .slot-page body{overflow:hidden}
</style>
</head>
<body>
<script>
  // Read the publisher-supplied ad sizes; each placement has its own iframe
  // so its script cannot overwrite another placement's atOptions value.
  const adSizes = [
    {key:"aea01d34a2c5e0b8c07ee9c98a71a19a",width:468,height:60},
    {key:"74623eb82832c7260317b236874c435f",width:160,height:300},
    {key:"d770303609f4c4028b2b1446cf810ac1",width:160,height:600},
    {key:"008faa77f149997884b507f444cfb4cd",width:320,height:50},
    {key:"797c350931164b2af01d762860993be3",width:728,height:90}
  ];
  const slotText = new URLSearchParams(location.search).get("slot");
  const slotIndex = slotText === null ? -1 : Number(slotText);
  const slotMode = Number.isInteger(slotIndex) && slotIndex >= 0 && slotIndex < adSizes.length;
  if (slotMode) {
    document.documentElement.classList.add("slot-page");
    const ad = adSizes[slotIndex];
    window.atOptions = {
      key:ad.key,format:"iframe",height:ad.height,width:ad.width,params:{}
    };
    // Parser-inserted script: preserves ad tags that use document.write().
    document.write('<script data-cfasync="false" src="https://biomanos.org/22/'+ad.key+'"><\/script>');
  } else {
    // The popunder and native units are loaded only once, not per iframe.
    document.write('<script data-cfasync="false" src="https://biomanos.org/14/11e239d255d66bf838f48f2fa61014d5"><\/script>');
    document.write('<script async data-cfasync="false" src="https://biomanos.org/21/55bd8aeabd90917c2c56507883ab80df"><\/script>');
    document.write('<div id="container-55bd8aeabd90917c2c56507883ab80df"></div>');
  }
</script>
<main id="wall"></main>
<div id="sentinel" aria-hidden="true"></div>
<script>
if (!slotMode) {
  const wall = document.getElementById("wall");
  const sentinel = document.getElementById("sentinel");
  const tiles = [];
  const occupied = [];
  const order = [2,1,4,0,3,1,2,3,0,4];
  const PREFETCH = 650;
  const CHUNK_SIZE = 8;
  let cursor = 0;
  let wallHeight = 0;
  let layoutWidth = 0;
  let scheduled = false;
  let resizeScheduled = false;

  function widthNow() {
    return Math.max(1, wall.clientWidth);
  }

  function gapNow() {
    return layoutWidth <= 320 ? 0 : 6;
  }

  // Bottom-left packing: prefer an available position in the highest row.
  // Width is based on the actual CSS viewport, including desktop zoom level.
  function findSpot(width, height) {
    const gap = gapNow();
    const xs = new Set([0]);
    for (const item of occupied) xs.add(item.x + item.w + gap);
    let best = null;
    for (const x of xs) {
      if (x + width > layoutWidth + 0.5) continue;
      const blockers = occupied.filter(item =>
        x < item.x + item.w + gap && x + width + gap > item.x
      ).sort((a,b) => a.y - b.y);
      let y = 0;
      for (const item of blockers) {
        if (item.y >= y + height + gap) break;
        if (y < item.y + item.h + gap &&
            y + height + gap > item.y) {
          y = item.y + item.h + gap;
        }
      }
      if (best === null || y < best.y - 0.01 ||
          (Math.abs(y - best.y) <= 0.01 && x < best.x)) {
        best = {x, y};
      }
    }
    return best || {x:0,y:wallHeight + gap};
  }

  function dimensions(index) {
    const ad = adSizes[index];
    const scale = Math.min(1,layoutWidth/ad.width);
    return {w:ad.width * scale, h:ad.height * scale, scale};
  }

  function position(tile) {
    const {w,h,scale} = dimensions(tile.index);
    const p = findSpot(w,h);
    tile.box.style.left = p.x + "px";
    tile.box.style.top = p.y + "px";
    tile.box.style.width = w + "px";
    tile.box.style.height = h + "px";
    tile.frame.style.transform = "scale(" + scale + ")";
    occupied.push({x:p.x,y:p.y,w,h});
    wallHeight = Math.max(wallHeight,p.y + h);
  }

  function setWallHeight() {
    wall.style.height = Math.ceil(wallHeight) + "px";
  }

  function rearrange() {
    layoutWidth = widthNow();
    occupied.length = 0;
    wallHeight = 0;
    for (const tile of tiles) position(tile);
    setWallHeight();
  }

  function topHasSpace() {
    if (!tiles.length) return true;
    // 160px is the narrowest supplied unit; scale it on narrow screens.
    const smallest = Math.min(160,layoutWidth);
    return findSpot(smallest,1).y < 0.5;
  }

  function chooseNextIndex() {
    const normal = order[cursor++ % order.length];
    if (!topHasSpace()) return normal;

    // While a top-row gap can still fit an ad, take the widest unit that
    // fits that gap instead of starting another row prematurely.
    let chosen = normal;
    let widest = -1;
    for (let index = 0; index < adSizes.length; index++) {
      const {w,h} = dimensions(index);
      if (findSpot(w,h).y < 0.5 && w > widest) {
        chosen = index;
        widest = w;
      }
    }
    return chosen;
  }

  function addTile() {
    const index = chooseNextIndex();
    const ad = adSizes[index];
    const box = document.createElement("div");
    box.className = "ad-tile";
    const frame = document.createElement("iframe");
    frame.title = "Advertisement";
    frame.loading = "lazy";
    frame.referrerPolicy = "strict-origin-when-cross-origin";
    frame.width = ad.width;
    frame.height = ad.height;
    frame.style.width = ad.width + "px";
    frame.style.height = ad.height + "px";
    const url = new URL(location.href);
    url.searchParams.set("slot",String(index));
    frame.src = url.href;
    box.appendChild(frame);
    wall.appendChild(box);
    const tile = {index,box,frame};
    tiles.push(tile);
    position(tile);
    setWallHeight();
  }

  function needsMore() {
    // Fill the new horizontal space first after desktop zoom-out.
    if (topHasSpace()) return true;
    // Only after width is occupied, extend below the visible region.
    return wall.getBoundingClientRect().bottom < innerHeight + PREFETCH;
  }

  function pump() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => {
      scheduled = false;
      let added = 0;
      while (added < CHUNK_SIZE && needsMore()) {
        addTile();
        added++;
      }
      if (needsMore()) pump();
    });
  }

  function resizeLayout() {
    if (resizeScheduled) return;
    resizeScheduled = true;
    requestAnimationFrame(() => {
      resizeScheduled = false;
      if (Math.abs(widthNow() - layoutWidth) >= 1) rearrange();
      pump();
    });
  }

  layoutWidth = widthNow();
  const observer = new IntersectionObserver(entries => {
    if (entries.some(entry => entry.isIntersecting)) pump();
  }, {rootMargin:PREFETCH + "px 0px"});
  observer.observe(sentinel);
  window.addEventListener("resize",resizeLayout,{passive:true});
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize",resizeLayout,{passive:true});
  }
  pump();
}
</script>
</body>
</html>
