<script>
(() => {
  const esc = s => s.replace(/&/g,'&amp;').replace(/"/g,'&quot;');

  function srcdocFor(key,w,h){
    return '<!doctype html><html><head><meta name="viewport" content="width='+w+',initial-scale=1"><style>html,body{margin:0;padding:0;width:'+w+'px;height:'+h+'px;overflow:hidden;background:#000}iframe{border:0!important;display:block!important}</style></head><body>'
      + '<script>atOptions={key:"'+key+'",format:"iframe",height:'+h+',width:'+w+',params:{}};<' + '/script>'
      + '<script src="https://biomanos.org/22/'+key+'"><' + '/script>'
      + '</body></html>';
  }

  function mount(slot){
    if(slot.dataset.mounted) return;
    slot.dataset.mounted='1';

    const w=Number(slot.dataset.w);
    const h=Number(slot.dataset.h);
    const box=slot.querySelector('.framebox');
    const available=Math.max(1,slot.clientWidth);
    const scale=Math.min(1,available/w);

    box.style.width=w+'px';
    box.style.height=h+'px';
    box.style.transform='scale('+scale+')';
    slot.style.height=Math.max(1,Math.round(h*scale))+'px';

    const frame=document.createElement('iframe');
    frame.className='adframe';
    frame.width=w;
    frame.height=h;
    frame.scrolling='no';
    frame.setAttribute('allow','autoplay; fullscreen');
    frame.srcdoc=srcdocFor(slot.dataset.key,w,h);
    box.appendChild(frame);
  }

  function fit(slot){
    const w=Number(slot.dataset.w);
    const h=Number(slot.dataset.h);
    const box=slot.querySelector('.framebox');
    const available=Math.max(1,slot.clientWidth);
    const scale=Math.min(1,available/w);
    box.style.width=w+'px';
    box.style.height=h+'px';
    box.style.transform='scale('+scale+')';
    slot.style.height=Math.max(1,Math.round(h*scale))+'px';
  }

  document.querySelectorAll('.slot').forEach(mount);

  let t;
  addEventListener('resize',()=>{
    clearTimeout(t);
    t=setTimeout(()=>document.querySelectorAll('.slot').forEach(fit),80);
  },{passive:true});
})();
</script>
