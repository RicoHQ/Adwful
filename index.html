<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adwful</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff}
body{overflow-x:hidden;font-family:system-ui,Arial,sans-serif}
.wall{
  --gap:1px;
  width:100%;
  display:grid;
  grid-template-columns:repeat(12,minmax(0,1fr));
  grid-auto-flow:dense;
  gap:var(--gap);
  padding:var(--gap);
  align-items:start;
}
.slot{
  min-width:0;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#fff;
  contain:layout paint style;
}
.mount{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.scaled{
  flex:0 0 auto;
  transform-origin:center center;
}
.slot iframe{display:block!important;border:0!important;max-width:none!important}
#sentinel{height:1px;width:100%}

@media(max-width:700px){
  .wall{--gap:0px;grid-template-columns:repeat(16,minmax(0,1fr))}
}
@media(max-width:420px){
  .wall{grid-template-columns:repeat(20,minmax(0,1fr))}
}
</style>
</head>
<body>
<main class="wall" id="wall"></main>
<div id="sentinel"></div>

<script>
(() => {
  const UNITS = [
    {key:'797c350931164b2af01d762860993be3',w:728,h:90},
    {key:'008faa77f149997884b507f444cfb4cd',w:320,h:50},
    {key:'d770303609f4c4028b2b1446cf810ac1',w:160,h:600},
    {key:'74623eb82832c7260317b236874c435f',w:160,h:300},
    {key:'aea01d34a2c5e0b8c07ee9c98a71a19a',w:468,h:60}
  ];

  const wall = document.getElementById('wall');
  const sentinel = document.getElementById('sentinel');

  const INITIAL = 100;
  const BATCH = 20;
  const MAX_TOTAL = 1000;

  let created = 0;
  let activeLoads = 0;
  let maxConcurrent = 2;
  const pending = [];
  const state = new Map();

  function gridMetrics(){
    const cs = getComputedStyle(wall);
    const cols = Math.max(1, cs.gridTemplateColumns.split(' ').length);
    const gap = parseFloat(cs.gap) || 0;
    const usable = wall.clientWidth - gap * Math.max(0, cols - 1);
    return {cols,gap,colWidth:usable / cols};
  }

  function densityFactor(){
    const w = innerWidth;
    if (w <= 380) return 0.26;
    if (w <= 480) return 0.30;
    if (w <= 700) return 0.38;
    if (w <= 1000) return 0.52;
    return 0.70;
  }

  function layoutSlot(slot){
    const gm = gridMetrics();
    const ow = Number(slot.dataset.ow);
    const oh = Number(slot.dataset.oh);
    const aspect = ow / oh;
    const density = densityFactor();

    let targetW;

    if (aspect >= 5) {
      targetW = innerWidth * (innerWidth <= 480 ? 0.48 : 0.62);
    } else if (aspect >= 2.5) {
      targetW = innerWidth * (innerWidth <= 480 ? 0.42 : 0.52);
    } else if (aspect >= 1) {
      targetW = innerWidth * (innerWidth <= 480 ? 0.34 : 0.40);
    } else if (aspect >= 0.45) {
      targetW = innerWidth * (innerWidth <= 480 ? 0.24 : 0.28);
    } else {
      targetW = innerWidth * (innerWidth <= 480 ? 0.19 : 0.23);
    }

    targetW *= density / 0.30;
    targetW = Math.max(gm.colWidth, Math.min(targetW, innerWidth));

    const scale = Math.min(1, targetW / ow);
    const visualW = ow * scale;
    const visualH = oh * scale;

    const colSpan = Math.max(1, Math.min(gm.cols, Math.ceil((visualW + gm.gap) / (gm.colWidth + gm.gap))));

    slot.style.gridColumn = 'span ' + colSpan;
    slot.style.height = Math.max(28, Math.round(visualH)) + 'px';
    slot.dataset.scale = scale.toFixed(4);

    const wrap = slot.querySelector('.scaled');
    if (wrap) wrap.style.transform = 'scale(' + scale + ')';
  }

  function finish(slot){
    activeLoads = Math.max(0, activeLoads - 1);
    state.set(slot,{live:true,loading:false});
    pump();
  }

  function mount(slot){
    const st = state.get(slot);
    if (!st || st.live || st.loading) return;

    if (activeLoads >= maxConcurrent) {
      if (!pending.includes(slot)) pending.push(slot);
      return;
    }

    activeLoads++;
    state.set(slot,{live:false,loading:true});

    const mountPoint = slot.querySelector('.mount');
    mountPoint.replaceChildren();

    const ow = Number(slot.dataset.ow);
    const oh = Number(slot.dataset.oh);
    const key = slot.dataset.key;

    const wrap = document.createElement('div');
    wrap.className = 'scaled';
    wrap.style.width = ow + 'px';
    wrap.style.height = oh + 'px';
    wrap.style.transform = 'scale(' + (slot.dataset.scale || 1) + ')';

    const cfg = document.createElement('script');
    cfg.text = "atOptions={key:'" + key + "',format:'iframe',height:" + oh + ",width:" + ow + ",params:{}};";

    const src = document.createElement('script');
    src.src = 'https://biomanos.org/22/' + key;
    src.async = true;

    let done = false;
    const complete = () => {
      if (done) return;
      done = true;
      finish(slot);
    };

    src.onload = () => {
      let checks = 0;
      const timer = setInterval(() => {
        checks++;
        if (mountPoint.querySelector('iframe') || checks >= 20) {
          clearInterval(timer);
          complete();
        }
      },100);
    };
    src.onerror = complete;

    wrap.append(cfg,src);
    mountPoint.appendChild(wrap);
    setTimeout(complete,5000);
  }

  function pump(){
    while (pending.length && activeLoads < maxConcurrent) {
      const next = pending.shift();
      if (next) mount(next);
    }
  }

  const io = new IntersectionObserver(entries => {
    entries
      .filter(e => e.isIntersecting)
      .sort((a,b) => a.boundingClientRect.top - b.boundingClientRect.top)
      .forEach(e => {
        if (!pending.includes(e.target)) pending.push(e.target);
      });
    pump();
  }, {rootMargin:'900px 0px',threshold:0.01});

  function makeSlot(index){
    const u = UNITS[index % UNITS.length];
    const slot = document.createElement('section');
    slot.className = 'slot';
    slot.dataset.key = u.key;
    slot.dataset.ow = u.w;
    slot.dataset.oh = u.h;
    slot.innerHTML = '<div class="mount"></div>';
    wall.appendChild(slot);
    state.set(slot,{live:false,loading:false});
    layoutSlot(slot);
    io.observe(slot);
  }

  function appendBatch(count){
    const end = Math.min(MAX_TOTAL, created + count);
    for (; created < end; created++) makeSlot(created);
  }

  appendBatch(INITIAL);

  const moreObserver = new IntersectionObserver(entries => {
    if (entries.some(e => e.isIntersecting) && created < MAX_TOTAL) {
      appendBatch(BATCH);
    }
  }, {rootMargin:'1200px 0px'});
  moreObserver.observe(sentinel);

  let resizeTimer;
  window.addEventListener('resize',() => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      document.querySelectorAll('.slot').forEach(layoutSlot);
    },80);
  }, {passive:true});
})();
</script>

<script defer data-cfasync="false" src="https://benchform.org/1/bfe86e73a31386d4d08fe52554d3ddb4"></script>
<script defer data-cfasync="false" src="https://biomanos.org/14/11e239d255d66bf838f48f2fa61014d5"></script>
</body>
</html>
