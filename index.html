<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adwful</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff}
body{overflow-x:hidden;font-family:system-ui,Arial,sans-serif}
.wall{
  --gap:1px; --row:4px; --mincol:18px;
  width:100%;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(var(--mincol),1fr));
  grid-auto-rows:var(--row);
  grid-auto-flow:dense;
  gap:var(--gap);
  padding:var(--gap);
}
.slot{
  min-width:0; min-height:0;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; background:#fff;
  contain:layout paint style;
}
.mount{
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
.scaled{transform:scale(.5);transform-origin:center center;flex:0 0 auto}
.slot iframe{display:block!important;border:0!important}
#sentinel{height:1px;width:100%}
@media(max-width:700px){.wall{--gap:0px;--row:3px;--mincol:12px}}
@media(max-width:420px){.wall{--row:2px;--mincol:9px}}
</style>
</head>
<body>
<main class="wall" id="wall"></main>
<div id="sentinel"></div>

<script>
(() => {
  const UNITS = [{"key":"797c350931164b2af01d762860993be3","w":728,"h":90},{"key":"008faa77f149997884b507f444cfb4cd","w":320,"h":50},{"key":"d770303609f4c4028b2b1446cf810ac1","w":160,"h":600},{"key":"74623eb82832c7260317b236874c435f","w":160,"h":300},{"key":"aea01d34a2c5e0b8c07ee9c98a71a19a","w":468,"h":60}];
  const wall = document.getElementById('wall');
  const sentinel = document.getElementById('sentinel');

  const INITIAL = 100;
  const BATCH = 10;
  const MAX_TOTAL = 1000;
  let maxConcurrent = 1;
  let maxLive = 12;

  let created = 0;
  let activeLoads = 0;
  const pending = [];
  const state = new Map();

  function metrics(){
    const cs = getComputedStyle(wall);
    const gap = parseFloat(cs.gap) || 0;
    const row = parseFloat(cs.gridAutoRows) || 2;
    const cols = Math.max(1, cs.gridTemplateColumns.split(' ').length);
    const inner = wall.clientWidth - gap * Math.max(0, cols - 1);
    return {gap,row,cols,col:inner/cols};
  }

  function pack(slot){
    const m = metrics();
    const w = parseFloat(slot.dataset.w) || m.col;
    const h = parseFloat(slot.dataset.h) || m.row;
    const colSpan = Math.max(1, Math.min(m.cols, Math.ceil((w + m.gap)/(m.col + m.gap))));
    const rowSpan = Math.max(1, Math.ceil((h + m.gap)/(m.row + m.gap)));
    slot.style.gridColumnEnd = 'span ' + colSpan;
    slot.style.gridRowEnd = 'span ' + rowSpan;
  }

  function distanceToViewport(slot){
    const r = slot.getBoundingClientRect();
    if (r.bottom < 0) return -r.bottom;
    if (r.top > innerHeight) return r.top - innerHeight;
    return 0;
  }

  function updateLiveCap(){
    let visible = 0;
    for (const slot of state.keys()) {
      const r = slot.getBoundingClientRect();
      if (r.bottom > 0 && r.top < innerHeight && r.right > 0 && r.left < innerWidth) visible++;
    }
    maxLive = Math.max(4, visible);
    maxConcurrent = Math.max(1, visible);
  }

  function evictFar(){
    updateLiveCap();
    const live = [...state.entries()]
      .filter(([,s]) => s.live)
      .map(([slot]) => slot)
      .sort((a,b) => distanceToViewport(b) - distanceToViewport(a));
    while (live.length > maxLive) {
      const slot = live.shift();
      const st = state.get(slot);
      if (!st || st.loading) continue;
      slot.querySelector('.mount').replaceChildren();
      state.set(slot,{live:false,loading:false});
    }
  }

  function finish(slot){
    activeLoads = Math.max(0, activeLoads - 1);
    state.set(slot,{live:true,loading:false});
    evictFar();
    while (pending.length && activeLoads < maxConcurrent) {
      const next = pending.shift();
      if (next) mount(next);
    }
  }

  function mount(slot){
    const st = state.get(slot) || {live:false,loading:false};
    if (st.live || st.loading) return;
    if (activeLoads >= maxConcurrent) {
      if (!pending.includes(slot)) pending.push(slot);
      return;
    }

    activeLoads++;
    state.set(slot,{live:false,loading:true});

    const mountPoint = slot.querySelector('.mount');
    mountPoint.replaceChildren();

    const ow = Number(slot.dataset.ow);
    const oh = Number(slot.dataset.oh);
    const key = slot.dataset.key;

    const wrap = document.createElement('div');
    wrap.className = 'scaled';
    wrap.style.width = ow + 'px';
    wrap.style.height = oh + 'px';

    const cfg = document.createElement('script');
    cfg.text = "atOptions={key:'" + key + "',format:'iframe',height:" + oh + ",width:" + ow + ",params:{}};";

    const src = document.createElement('script');
    src.src = 'https://biomanos.org/22/' + key;
    src.async = true;

    let done = false;
    const complete = () => {
      if (done) return;
      done = true;
      finish(slot);
    };

    src.onload = complete;
    src.onerror = complete;

    wrap.append(cfg,src);
    mountPoint.appendChild(wrap);
    setTimeout(complete,5000);
  }

  const io = new IntersectionObserver(entries => {
    updateLiveCap();
    entries.filter(e => e.isIntersecting)
      .sort((a,b) => distanceToViewport(a.target) - distanceToViewport(b.target))
      .forEach(e => mount(e.target));
    pumpVisible();
    evictFar();
  }, {rootMargin:'0px',threshold:0.01});

  function pumpVisible(){
    updateLiveCap();
    const visibleSlots = [...state.keys()]
      .filter(slot => {
        const r = slot.getBoundingClientRect();
        return r.bottom > 0 && r.top < innerHeight && r.right > 0 && r.left < innerWidth;
      })
      .sort((a,b) => distanceToViewport(a) - distanceToViewport(b));

    for (const slot of visibleSlots) mount(slot);
  }

  function makeSlot(index){
    const u = UNITS[index % UNITS.length];
    const slot = document.createElement('section');
    slot.className = 'slot';
    slot.dataset.key = u.key;
    slot.dataset.ow = u.w;
    slot.dataset.oh = u.h;
    slot.dataset.w = Math.max(20,u.w/2);
    slot.dataset.h = Math.max(12,u.h/2);
    slot.innerHTML = '<div class="mount"></div>';
    wall.appendChild(slot);
    state.set(slot,{live:false,loading:false});
    pack(slot);
    io.observe(slot);
  }

  function appendBatch(count){
    const end = Math.min(MAX_TOTAL, created + count);
    for (; created < end; created++) makeSlot(created);
  }

  appendBatch(INITIAL);

  function tailIsFilled(){
    const all = [...state.keys()];
    if (!all.length) return false;
    const tail = all.slice(-Math.min(BATCH, all.length));
    return tail.every(slot => {
      const st = state.get(slot);
      if (!st?.live) return false;
      const mount = slot.querySelector('.mount');
      const frame = mount?.querySelector('iframe');
      return !!frame || (mount && mount.childElementCount > 0);
    });
  }

  const moreObserver = new IntersectionObserver(entries => {
    if (!entries.some(e => e.isIntersecting) || created >= MAX_TOTAL) return;
    if (tailIsFilled()) appendBatch(BATCH);
  }, {rootMargin:'500px 0px'});
  moreObserver.observe(sentinel);

  const fillWatcher = new MutationObserver(() => {
    if (created >= MAX_TOTAL) return;
    const r = sentinel.getBoundingClientRect();
    if (r.top < innerHeight + 500 && tailIsFilled()) appendBatch(BATCH);
  });
  fillWatcher.observe(wall,{subtree:true,childList:true});

  window.addEventListener('resize',() => {
    document.querySelectorAll('.slot').forEach(pack);
    updateLiveCap();
    pumpVisible();
    evictFar();
  }, {passive:true});

  window.addEventListener('scroll',() => {
    updateLiveCap();
    pumpVisible();
    evictFar();
  }, {passive:true});

  requestAnimationFrame(pumpVisible);
})();
</script>

</body>
</html>
