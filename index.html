<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff}
body{overflow-x:hidden;font-family:system-ui,Arial,sans-serif}
.wall{
  --gap:1px;
  --row:4px;
  --mincol:18px;
  width:100%;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(var(--mincol),1fr));
  grid-auto-rows:var(--row);
  grid-auto-flow:dense;
  gap:var(--gap);
  padding:var(--gap);
  align-items:stretch;
}
.slot{
  min-width:0;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#fff;
}
.adwrap{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.scaled{
  width:var(--ow);
  height:var(--oh);
  transform:scale(.1);
  transform-origin:center center;
  flex:0 0 auto;
}
.slot iframe{display:block!important;border:0!important}
.native>div{width:100%;height:100%;min-height:100%}
@media(max-width:700px){
  .wall{--gap:0px;--row:3px;--mincol:12px}
}
@media(max-width:420px){
  .wall{--row:2px;--mincol:9px}
}
</style>

<script>
(function(){
  const wall=document.getElementById('wall');
  function metrics(){
    const cs=getComputedStyle(wall);
    const gap=parseFloat(cs.gap)||0;
    const row=parseFloat(cs.gridAutoRows)||2;
    const cols=Math.max(1,getComputedStyle(wall).gridTemplateColumns.split(' ').length);
    const inner=wall.clientWidth-gap*Math.max(0,cols-1);
    return {gap,row,cols,col:inner/cols};
  }
  function pack(slot,w,h){
    const m=metrics();
    w=w||parseFloat(slot.dataset.w)||m.col;
    h=h||parseFloat(slot.dataset.h)||m.row;
    const colSpan=Math.max(1,Math.min(m.cols,Math.ceil((w+m.gap)/(m.col+m.gap))));
    const rowSpan=Math.max(1,Math.ceil((h+m.gap)/(m.row+m.gap)));
    slot.style.gridColumnEnd='span '+colSpan;
    slot.style.gridRowEnd='span '+rowSpan;
  }
  function repack(){
    document.querySelectorAll('.slot').forEach(slot=>{
      const frame=slot.querySelector('iframe');
      if(frame){
        const aw=parseFloat(frame.getAttribute('width'));
        const ah=parseFloat(frame.getAttribute('height'));
        if(aw&&ah){ pack(slot,aw*.1,ah*.1); return; }
      }
      pack(slot);
    });
  }
  repack();
  window.addEventListener('resize',repack);
  window.addEventListener('load',repack);
  const mo=new MutationObserver(()=>requestAnimationFrame(repack));
  mo.observe(wall,{subtree:true,childList:true,attributes:true});
  setTimeout(repack,1000);
  setTimeout(repack,3000);
})();
</script>
