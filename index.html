<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#fff}
  body{overflow-x:hidden;font-family:system-ui,Arial,sans-serif}

  .wall{
    --gap:2px;
    --row:24px;
    --mincol:110px;
    width:100%;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(var(--mincol),1fr));
    grid-auto-rows:var(--row);
    grid-auto-flow:dense;
    gap:var(--gap);
    padding:var(--gap);
    align-items:stretch;
  }

  .slot{
    min-width:0;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#fff;
  }

  .adwrap{
    width:100%;
    height:100%;
    min-width:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .slot iframe{
    display:block!important;
    border:0!important;
    max-width:100%!important;
  }

  .native > div{width:100%;height:100%;min-height:100%}

  @media(max-width:700px){
    .wall{
      --gap:1px;
      --row:18px;
      --mincol:76px;
    }
  }

  @media(max-width:420px){
    .wall{
      --row:16px;
      --mincol:64px;
    }
  }
</style>

<script>
(function(){
  const wall = document.getElementById('wall');

  function metrics(){
    const cs = getComputedStyle(wall);
    const gap = parseFloat(cs.gap) || 0;
    const row = parseFloat(cs.gridAutoRows) || 16;
    const cols = getComputedStyle(wall).gridTemplateColumns.split(' ').length || 1;
    const inner = wall.clientWidth - gap * Math.max(0, cols - 1);
    const col = inner / cols;
    return {gap,row,cols,col};
  }

  function pack(slot, measured){
    const m = metrics();
    let w = measured?.width || parseFloat(slot.dataset.w) || m.col;
    let h = measured?.height || parseFloat(slot.dataset.h) || m.row;

    const maxW = wall.clientWidth;
    const scale = w > maxW ? maxW / w : 1;
    w *= scale;
    h *= scale;

    const colSpan = Math.max(1, Math.min(m.cols, Math.ceil((w + m.gap) / (m.col + m.gap))));
    const allocatedW = colSpan * m.col + (colSpan - 1) * m.gap;
    const finalScale = w > allocatedW ? allocatedW / w : 1;
    const finalH = Math.max(m.row, h * finalScale);
    const rowSpan = Math.max(1, Math.ceil((finalH + m.gap) / (m.row + m.gap)));

    slot.style.gridColumnEnd = 'span ' + colSpan;
    slot.style.gridRowEnd = 'span ' + rowSpan;
  }

  function measureSlot(slot){
    const frame = slot.querySelector('iframe');
    if(frame){
      const attrW = parseFloat(frame.getAttribute('width'));
      const attrH = parseFloat(frame.getAttribute('height'));
      const rect = frame.getBoundingClientRect();
      const w = attrW || rect.width;
      const h = attrH || rect.height;
      if(w && h) return {width:w,height:h};
    }

    const child = slot.querySelector('.adwrap > *:not(script), .native > *:not(script)');
    if(child){
      const r = child.getBoundingClientRect();
      if(r.width && r.height) return {width:r.width,height:r.height};
    }
    return null;
  }

  function repack(){
    document.querySelectorAll('.slot').forEach(slot => pack(slot, measureSlot(slot)));
  }

  document.querySelectorAll('.slot').forEach(slot => pack(slot));

  const ro = new ResizeObserver(() => repack());
  ro.observe(wall);
  document.querySelectorAll('.slot').forEach(slot => ro.observe(slot));

  const mo = new MutationObserver(() => {
    requestAnimationFrame(repack);
    setTimeout(repack,250);
    setTimeout(repack,1000);
  });
  mo.observe(wall,{subtree:true,childList:true,attributes:true});

  window.addEventListener('load',repack);
  window.addEventListener('resize',repack);
  setTimeout(repack,1500);
  setTimeout(repack,4000);
})();
</script>
