<script>
(function(){
  function fit(){
    document.querySelectorAll('.slot').forEach(function(slot){
      const inner = slot.querySelector('.inner');
      if(!inner || inner.classList.contains('native-inner')) return;

      const ow = Number(inner.dataset.w || 1);
      const oh = Number(inner.dataset.h || 1);
      const available = Math.max(1, slot.clientWidth);

      const scale = Math.min(1, available / ow);
      const scaledW = Math.round(ow * scale);
      const scaledH = Math.round(oh * scale);

      inner.style.width = ow + 'px';
      inner.style.height = oh + 'px';
      inner.style.transform = 'scale(' + scale + ')';
      inner.style.marginLeft = Math.max(0, Math.floor((available - scaledW)/2)) + 'px';

      slot.style.height = scaledH + 'px';
    });
  }

  addEventListener('load', function(){
    fit();
    setTimeout(fit,500);
    setTimeout(fit,1500);
  });

  let t;
  addEventListener('resize', function(){
    clearTimeout(t);
    t=setTimeout(fit,80);
  }, {passive:true});
})();
</script>
