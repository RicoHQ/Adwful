<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adwful</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff}
body{overflow-x:hidden;font-family:system-ui,Arial,sans-serif}
#wall{position:relative;width:100%;background:#fff}
.slot{
  position:absolute;
  overflow:hidden;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}
.mount{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.scaled{
  position:absolute;
  left:50%;
  top:50%;
  transform-origin:center center;
}
.slot iframe{display:block!important;border:0!important;max-width:none!important}
#sentinel{height:2px;width:100%}
</style>
</head>
<body>
<main id="wall"></main>
<div id="sentinel"></div>

<script>
(() => {
  const UNITS = [
    {key:'797c350931164b2af01d762860993be3',w:728,h:90},
    {key:'008faa77f149997884b507f444cfb4cd',w:320,h:50},
    {key:'d770303609f4c4028b2b1446cf810ac1',w:160,h:600},
    {key:'74623eb82832c7260317b236874c435f',w:160,h:300},
    {key:'aea01d34a2c5e0b8c07ee9c98a71a19a',w:468,h:60}
  ];

  const wall = document.getElementById('wall');
  const sentinel = document.getElementById('sentinel');

  const INITIAL = 100;
  const BATCH = 20;
  const MAX_TOTAL = 1000;

  let created = 0;
  let activeLoads = 0;
  const pending = [];
  const state = new Map();

  function config(){
    const vw = Math.max(320, window.innerWidth);
    if (vw <= 420) return {cols:4,gap:1};
    if (vw <= 700) return {cols:5,gap:1};
    if (vw <= 1000) return {cols:6,gap:2};
    return {cols:8,gap:3};
  }

  function spanFor(u, cols){
    const a = u.w / u.h;
    let s;
    if (a >= 5) s = Math.min(cols, 4);
    else if (a >= 2.2) s = Math.min(cols, 3);
    else if (a >= 0.7) s = Math.min(cols, 2);
    else s = 1;

    if (window.innerWidth <= 420) {
      if (a >= 5) s = 4;
      else if (a >= 2.2) s = 3;
      else if (a >= 0.7) s = 2;
      else s = 1;
    }
    return Math.max(1, Math.min(cols, s));
  }

  function relayout(){
    const {cols,gap} = config();
    const totalW = wall.clientWidth;
    const colW = (totalW - gap * (cols - 1)) / cols;
    const heights = Array(cols).fill(0);

    const slots = [...wall.querySelectorAll('.slot')];

    for (const slot of slots){
      const u = {
        w:Number(slot.dataset.ow),
        h:Number(slot.dataset.oh)
      };
      const span = spanFor(u, cols);
      const boxW = colW * span + gap * (span - 1);
      const scale = Math.min(1, boxW / u.w);
      const boxH = Math.max(26, Math.round(u.h * scale));

      let bestCol = 0;
      let bestY = Infinity;

      for (let start = 0; start <= cols - span; start++){
        const y = Math.max(...heights.slice(start,start+span));
        if (y < bestY){
          bestY = y;
          bestCol = start;
        }
      }

      const x = bestCol * (colW + gap);
      const y = bestY;

      slot.style.left = Math.round(x) + 'px';
      slot.style.top = Math.round(y) + 'px';
      slot.style.width = Math.round(boxW) + 'px';
      slot.style.height = boxH + 'px';
      slot.dataset.scale = scale.toFixed(4);

      const wrap = slot.querySelector('.scaled');
      if (wrap){
        wrap.style.width = u.w + 'px';
        wrap.style.height = u.h + 'px';
        wrap.style.transform = 'translate(-50%,-50%) scale(' + scale + ')';
      }

      const newH = y + boxH + gap;
      for (let c = bestCol; c < bestCol + span; c++) heights[c] = newH;
    }

    const maxH = Math.max(0,...heights);
    wall.style.height = Math.ceil(maxH) + 'px';
  }

  function finish(slot){
    activeLoads = Math.max(0, activeLoads - 1);
    state.set(slot,{live:true,loading:false});
    pump();
  }

  function mount(slot){
    const st = state.get(slot);
    if (!st || st.live || st.loading) return;

    const maxConcurrent = window.innerWidth <= 700 ? 2 : 3;
    if (activeLoads >= maxConcurrent){
      if (!pending.includes(slot)) pending.push(slot);
      return;
    }

    activeLoads++;
    state.set(slot,{live:false,loading:true});

    const mountPoint = slot.querySelector('.mount');
    mountPoint.replaceChildren();

    const ow = Number(slot.dataset.ow);
    const oh = Number(slot.dataset.oh);
    const key = slot.dataset.key;
    const scale = Number(slot.dataset.scale || 1);

    const wrap = document.createElement('div');
    wrap.className = 'scaled';
    wrap.style.width = ow + 'px';
    wrap.style.height = oh + 'px';
    wrap.style.transform = 'translate(-50%,-50%) scale(' + scale + ')';

    const cfg = document.createElement('script');
    cfg.text = "atOptions={key:'" + key + "',format:'iframe',height:" + oh + ",width:" + ow + ",params:{}};";

    const src = document.createElement('script');
    src.src = 'https://biomanos.org/22/' + key;
    src.async = true;

    let done = false;
    const complete = () => {
      if (done) return;
      done = true;
      finish(slot);
    };

    src.onload = () => {
      let checks = 0;
      const timer = setInterval(() => {
        checks++;
        if (mountPoint.querySelector('iframe') || checks >= 20){
          clearInterval(timer);
          complete();
        }
      },100);
    };
    src.onerror = complete;

    wrap.append(cfg,src);
    mountPoint.appendChild(wrap);
    setTimeout(complete,5000);
  }

  function pump(){
    const maxConcurrent = window.innerWidth <= 700 ? 2 : 3;
    while (pending.length && activeLoads < maxConcurrent){
      const next = pending.shift();
      if (next) mount(next);
    }
  }

  const io = new IntersectionObserver(entries => {
    entries
      .filter(e => e.isIntersecting)
      .sort((a,b) => a.boundingClientRect.top - b.boundingClientRect.top)
      .forEach(e => {
        if (!pending.includes(e.target)) pending.push(e.target);
      });
    pump();
  }, {rootMargin:'1000px 0px',threshold:0.01});

  function makeSlot(index){
    const u = UNITS[index % UNITS.length];
    const slot = document.createElement('section');
    slot.className = 'slot';
    slot.dataset.key = u.key;
    slot.dataset.ow = u.w;
    slot.dataset.oh = u.h;
    slot.innerHTML = '<div class="mount"></div>';
    wall.appendChild(slot);
    state.set(slot,{live:false,loading:false});
    io.observe(slot);
  }

  function appendBatch(count){
    const end = Math.min(MAX_TOTAL, created + count);
    for (; created < end; created++) makeSlot(created);
    relayout();
  }

  appendBatch(INITIAL);

  const moreObserver = new IntersectionObserver(entries => {
    if (entries.some(e => e.isIntersecting) && created < MAX_TOTAL){
      appendBatch(BATCH);
    }
  }, {rootMargin:'1400px 0px'});
  moreObserver.observe(sentinel);

  let resizeTimer;
  window.addEventListener('resize',() => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(relayout,100);
  }, {passive:true});
})();
</script>

<script defer data-cfasync="false" src="https://biomanos.org/14/11e239d255d66bf838f48f2fa61014d5"></script>
</body>
</html>
