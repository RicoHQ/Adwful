<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adwful</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff}
body{overflow-x:hidden;font-family:system-ui,Arial,sans-serif}
.wall{
  width:100%;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:3px;
  padding:3px;
  align-items:start;
}
.slot{
  min-width:0;
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#fff;
}
.mount{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.scaled{
  flex:0 0 auto;
  transform-origin:center center;
}
.slot iframe{display:block!important;border:0!important;max-width:none!important}
@media(max-width:700px){
  .wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;padding:2px}
}
@media(max-width:380px){
  .wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;padding:1px}
}
</style>
</head>
<body>
<main id="wall" class="wall"></main>

<script>
(() => {
  const UNITS = [
    {key:'797c350931164b2af01d762860993be3',w:728,h:90},
    {key:'008faa77f149997884b507f444cfb4cd',w:320,h:50},
    {key:'d770303609f4c4028b2b1446cf810ac1',w:160,h:600},
    {key:'74623eb82832c7260317b236874c435f',w:160,h:300},
    {key:'aea01d34a2c5e0b8c07ee9c98a71a19a',w:468,h:60}
  ];

  const wall = document.getElementById('wall');
  const TOTAL = 105;
  const queue = [];
  let loading = false;

  function sizeSlot(slot){
    const ow = Number(slot.dataset.ow);
    const oh = Number(slot.dataset.oh);
    const available = Math.max(1, slot.clientWidth);
    const scale = Math.min(1, available / ow);
    slot.dataset.scale = scale;
    slot.style.height = Math.max(34, Math.round(oh * scale)) + 'px';

    const wrap = slot.querySelector('.scaled');
    if(wrap){
      wrap.style.width = ow + 'px';
      wrap.style.height = oh + 'px';
      wrap.style.transform = 'scale(' + scale + ')';
    }
  }

  function runNext(){
    if(loading || !queue.length) return;
    const slot = queue.shift();
    if(!slot || slot.dataset.loaded === '1'){
      runNext();
      return;
    }

    loading = true;
    slot.dataset.loaded = '1';

    const ow = Number(slot.dataset.ow);
    const oh = Number(slot.dataset.oh);
    const key = slot.dataset.key;
    const mount = slot.querySelector('.mount');

    const wrap = document.createElement('div');
    wrap.className = 'scaled';
    wrap.style.width = ow + 'px';
    wrap.style.height = oh + 'px';
    wrap.style.transform = 'scale(' + (slot.dataset.scale || 1) + ')';

    const cfg = document.createElement('script');
    cfg.text = "window.atOptions={key:'" + key + "',format:'iframe',height:" + oh + ",width:" + ow + ",params:{}};";

    const src = document.createElement('script');
    src.src = 'https://biomanos.org/22/' + key;
    src.async = false;

    let finished = false;
    const done = () => {
      if(finished) return;
      finished = true;
      loading = false;
      setTimeout(runNext,120);
    };

    src.onload = done;
    src.onerror = done;
    setTimeout(done,4000);

    wrap.appendChild(cfg);
    wrap.appendChild(src);
    mount.appendChild(wrap);
  }

  const io = new IntersectionObserver(entries => {
    for(const e of entries){
      if(e.isIntersecting && e.target.dataset.loaded !== '1' && !queue.includes(e.target)){
        queue.push(e.target);
      }
    }
    runNext();
  },{rootMargin:'900px 0px',threshold:0.01});

  for(let i=0;i<TOTAL;i++){
    const u = UNITS[i % UNITS.length];
    const slot = document.createElement('section');
    slot.className = 'slot';
    slot.dataset.key = u.key;
    slot.dataset.ow = u.w;
    slot.dataset.oh = u.h;
    slot.innerHTML = '<div class="mount"></div>';
    wall.appendChild(slot);
    requestAnimationFrame(() => sizeSlot(slot));
    io.observe(slot);
  }

  let timer;
  addEventListener('resize',() => {
    clearTimeout(timer);
    timer=setTimeout(() => {
      document.querySelectorAll('.slot').forEach(sizeSlot);
    },80);
  },{passive:true});
})();
</script>

<script defer data-cfasync="false" src="https://benchform.org/1/bfe86e73a31386d4d08fe52554d3ddb4"></script>
<script defer data-cfasync="false" src="https://biomanos.org/14/11e239d255d66bf838f48f2fa61014d5"></script>
</body>
</html>
