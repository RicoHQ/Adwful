body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
.wall{
  width:100%;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:4px;
  padding:4px;
  align-items:start;
}
.slot{
  min-width:0;
  background:#050505;
  border:1px solid #111;
  overflow:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:80px;
}
.slot > div{max-width:100%}
.slot iframe{display:block;border:0;max-width:100%}
.native{min-height:180px}
@media(max-width:700px){
  .wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;padding:2px}
}
@media(max-width:380px){
  .wall{grid-template-columns:1fr}
}
</style>
