<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adwful</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff}
body{overflow-x:hidden;font-family:system-ui,Arial,sans-serif}
.wall{
  --gap:1px;
  --row:4px;
  --mincol:18px;
  width:100%;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(var(--mincol),1fr));
  grid-auto-rows:var(--row);
  grid-auto-flow:dense;
  gap:var(--gap);
  padding:var(--gap);
}
.slot{
  min-width:0;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#fff;
  contain:layout paint style;
  content-visibility:auto;
  contain-intrinsic-size:20px 20px;
}
.mount{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.scaled{
  transform:scale(.1);
  transform-origin:center center;
  flex:0 0 auto;
}
.slot iframe{display:block!important;border:0!important}
@media(max-width:700px){.wall{--gap:0px;--row:3px;--mincol:12px}}
@media(max-width:420px){.wall{--row:2px;--mincol:9px}}
</style>
</head>

<script>
(() => {
  const wall = document.getElementById('wall');
  const queue = [];
  let active = 0;
  const MAX_CONCURRENT = 6;
  const mounted = new WeakSet();

  function metrics(){
    const cs = getComputedStyle(wall);
    const gap = parseFloat(cs.gap) || 0;
    const row = parseFloat(cs.gridAutoRows) || 2;
    const cols = Math.max(1, cs.gridTemplateColumns.split(' ').length);
    const inner = wall.clientWidth - gap * Math.max(0, cols - 1);
    return {gap,row,cols,col:inner / cols};
  }

  function pack(slot){
    const m = metrics();
    const w = parseFloat(slot.dataset.w) || m.col;
    const h = parseFloat(slot.dataset.h) || m.row;
    const colSpan = Math.max(1, Math.min(m.cols, Math.ceil((w + m.gap) / (m.col + m.gap))));
    const rowSpan = Math.max(1, Math.ceil((h + m.gap) / (m.row + m.gap)));
    slot.style.gridColumnEnd = 'span ' + colSpan;
    slot.style.gridRowEnd = 'span ' + rowSpan;
  }

  function makeAd(slot){
    if (mounted.has(slot)) return Promise.resolve();
    mounted.add(slot);

    return new Promise(resolve => {
      const mount = slot.querySelector('.mount');
      const ow = Number(slot.dataset.ow);
      const oh = Number(slot.dataset.oh);
      const key = slot.dataset.key;

      const wrap = document.createElement('div');
      wrap.className = 'scaled';
      wrap.style.width = ow + 'px';
      wrap.style.height = oh + 'px';

      const cfg = document.createElement('script');
      cfg.text = "atOptions={key:'" + key + "',format:'iframe',height:" + oh + ",width:" + ow + ",params:{}};";

      const src = document.createElement('script');
      src.src = 'https://biomanos.org/22/' + key;
      src.async = true;
      src.onload = resolve;
      src.onerror = resolve;

      wrap.append(cfg, src);
      mount.appendChild(wrap);

      setTimeout(resolve, 4000);
    });
  }

  function pump(){
    while (active < MAX_CONCURRENT && queue.length) {
      const slot = queue.shift();
      active++;
      makeAd(slot).finally(() => {
        active--;
        pump();
      });
    }
  }

  function enqueue(slot){
    if (mounted.has(slot) || queue.includes(slot)) return;
    queue.push(slot);
    pump();
  }

  document.querySelectorAll('.slot').forEach(pack);

  const io = new IntersectionObserver(entries => {
    for (const e of entries) {
      if (e.isIntersecting) enqueue(e.target);
    }
  }, {rootMargin:'800px 0px 800px 0px', threshold:0.01});

  document.querySelectorAll('.slot').forEach(slot => io.observe(slot));

  window.addEventListener('resize', () => {
    document.querySelectorAll('.slot').forEach(pack);
  }, {passive:true});

  // Warm-start a small number so the first screen doesn't feel empty.
  document.querySelectorAll('.slot').forEach((slot, i) => {
    if (i < 24) enqueue(slot);
  });
})();
</script>
