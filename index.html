<script>
(function(){
  function fit(slot){
    const box = slot.querySelector('.adbox');
    if(!box) return;

    const w = Number(slot.dataset.w);
    const h = Number(slot.dataset.h);
    const available = Math.max(1, slot.clientWidth);
    const scale = Math.min(1, available / w);

    box.style.width = w + 'px';
    box.style.height = h + 'px';
    box.style.transform = 'scale(' + scale + ')';
    slot.style.height = Math.max(1, Math.ceil(h * scale)) + 'px';
  }

  function fitAll(){
    document.querySelectorAll('.slot').forEach(fit);
  }

  fitAll();
  addEventListener('load', fitAll);
  setTimeout(fitAll, 500);
  setTimeout(fitAll, 1500);

  let timer;
  addEventListener('resize', function(){
    clearTimeout(timer);
    timer = setTimeout(fitAll, 80);
  }, {passive:true});
})();
</script>
